name: Safe checks

on:
  pull_request:
  push:
    branches: [main, staging-prep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      OPENAI_API_KEY: ''
      DEMO_SESSION_SECRET: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx --no-install tsc --noEmit
      - name: Non-database tests only
        run: npm run test:safe -- --no-db
      - name: QA network boundary
        run: node scripts/dev/qa-egress-tests.mjs
